{% extends "base.html" %}

{% block title %}FastAPI 聊天室{% endblock %}

{% block content %}
<div class="flex justify-between items-center p-4">
    <h2 class="text-xl font-bold">FastAPI 聊天室</h2>
    <div class="flex items-center space-x-2">
        <span class="bg-green-500 text-white px-2 py-1 rounded text-sm" id="userBadge"></span>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">登出</button>
    </div>
</div>

<div class="chat-container">
    <div class="scrollable p-4" id="scrollable">
        <div id="out" class="space-y-2 mb-4">
            <!-- 消息会动态添加在这里 -->
        </div>
    </div>
    <div id="suggestions" class="p-4 hidden bg-gray-800 border border-gray-700 rounded">
        <div class="suggestion-item cursor-pointer">🤖AI助手</div>
    </div>
    <div class="p-4">
        <input id="messageInput" placeholder="回车发送 (使用 @ai 开头可以与AI对话)" class="w-full p-2 bg-gray-800 border border-gray-700 rounded">
    </div>
</div>

<div id="connectionStatus" class="fixed bottom-4 right-4">
    <span class="bg-gray-600 text-white px-2 py-1 rounded text-sm">连接中...</span>
</div>
{% endblock %}

{% block scripts %}
<script>
let ws = null;
let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let lastMessageTime = null;
const defaultAvatar = "https://api.7trees.cn/avatar";

// 检查登录状态
if (!token || !username) {
    window.location.href = '/login';
}

document.getElementById('userBadge').textContent = username;

function easeOutQuad(t) {
    return t * (2 - t);
}

function smoothScrollToBottom(element) {
    const targetScrollTop = element.scrollHeight;
    const duration = 400;
    const startScrollTop = element.scrollTop;
    const distance = targetScrollTop - startScrollTop;
    let startTime = null;

    function animation(currentTime) {
        if (!startTime) startTime = currentTime;
        const timeElapsed = currentTime - startTime;
        const t = Math.min(timeElapsed / duration, 1);
        const ease = easeOutQuad(t);
        element.scrollTop = startScrollTop + distance * ease;

        if (t < 1) requestAnimationFrame(animation);
    }

    requestAnimationFrame(animation);
}

// 建立WebSocket连接
function connectWebSocket() {
    ws = new WebSocket(`ws://localhost:8000/ws/${token}`);
    
    ws.onopen = function(event) {
        console.log('WebSocket连接已建立');
        document.getElementById('connectionStatus').innerHTML = '<span class="bg-green-500 text-white px-2 py-1 rounded text-sm">已连接</span>';
        
        // 请求历史消息
        ws.send(JSON.stringify({
            type: 'get_history'
        }));
    };
    
    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.type === 'new_message') {
            addMessage(data.message);
            const scrollable = document.getElementById('scrollable');
            setTimeout(() => {
                smoothScrollToBottom(scrollable);
            }, 200);
        } else if (data.type === 'history_messages') {
            const out = document.getElementById('out');
            out.innerHTML = '';
            data.messages.forEach(message => {
                addMessage(message);
            });
        }
    };
    
    ws.onclose = function(event) {
        console.log('WebSocket连接已关闭');
        document.getElementById('connectionStatus').innerHTML = '<span class="bg-red-500 text-white px-2 py-1 rounded text-sm">连接断开</span>';
        
        // 尝试重连
        setTimeout(connectWebSocket, 3000);
    };
    
    ws.onerror = function(error) {
        console.error('WebSocket错误:', error);
        document.getElementById('connectionStatus').innerHTML = '<span class="bg-yellow-500 text-white px-2 py-1 rounded text-sm">连接错误</span>';
    };
}

function addMessage(message) {
    var out = document.getElementById('out');
    let currentTime = new Date();

    // 当前时间是否与上条消息间隔超过1分钟
    if (lastMessageTime && (currentTime - lastMessageTime) > 60000) {
        var timeSeparator = `<div class="text-center text-gray-500 my-2">--- ${formatDate(currentTime)} ---</div>`;
        out.innerHTML += timeSeparator;
    }

    function indexOfThirdColon(message) {
        let index = -1;
        for (let i = 0; i < 3; i++) {
            index = message.indexOf(':', index + 1);
            if (index === -1) {
                return -1;
            }
        }
        return index;
    }

    const thirdColonIndex = indexOfThirdColon(message);
    const indexOfColon = thirdColonIndex;
    
    if (indexOfColon >= 0) {
        const extractedUsername = message.substring(11, indexOfColon).trim();
        const userMessage = message.substring(indexOfColon + 1).trim();

        let messageHTML = '';

        if (extractedUsername === username) {
            messageHTML = `
            <div class="message-container my-message-container">
                <img src="${defaultAvatar}?${extractedUsername}" alt="Avatar" class="avatar">
                <div class="chat-bubble my-message">
                    <div class="username">${extractedUsername}（我）</div>
                    <div>${userMessage}</div>
                </div>
            </div>`;
        } else if (extractedUsername === '🤖AI助手') {
            messageHTML = `
            <div class="message-container their-message-container">
                <img src="${defaultAvatar}?${extractedUsername}" alt="Avatar" class="avatar">
                <div class="chat-bubble their-message">
                    <div class="username">${extractedUsername}</div>
                    <div>${marked.parse(userMessage)}</div>
                </div>
            </div>`;
        } else {
            messageHTML = `
            <div class="message-container their-message-container">
                <img src="${defaultAvatar}?${extractedUsername}" alt="Avatar" class="avatar">
                <div class="chat-bubble their-message">
                    <div class="username">${extractedUsername}</div>
                    <div>${userMessage}</div>
                </div>
            </div>`;
        }

        out.innerHTML += messageHTML;
        lastMessageTime = currentTime;
    }
}

function formatDate(date) {
    return `${date.getHours()}:${date.getMinutes() < 10 ? '0' : ''}${date.getMinutes()}`;
}

$('#messageInput').keyup(function (e) {
    const suggestions = $('#suggestions');
    const suggestionsItem = suggestions.find('.suggestion-item');
    const inputValue = $(this).val();

    if (e.keyCode === 13) { // Enter 键
        const message = inputValue;
        if (message && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'send_message',
                message: message
            }));
            $(this).val('');
            suggestions.hide();
        }
    } else if (inputValue.endsWith('/')) {
        suggestions.show();
    } else {
        suggestions.hide();
    }

    // 处理选择栏点击事件
    suggestionsItem.off('click').on('click', function () {
        $(this).closest('#suggestions').hide();
        $('#messageInput').val(inputValue.replace(/\/$/, '@ai '));
        $('#messageInput').focus();
    });
});

// 退出登录
async function logout() {
    if (confirm('确认要登出吗？')) {
        try {
            await fetch('/api/logout', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
        } catch (error) {
            console.error('退出登录失败:', error);
        }
        
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('historyRequested');
        
        if (ws) {
            ws.close();
        }
        
        window.location.href = '/login';
    }
}

// 初始化WebSocket连接
connectWebSocket();
</script>
{% endblock %}
